name: Servidor con Cloudflare Tunnel

on:
  workflow_dispatch:
  schedule:
    # Minuto no saturado (ej. 23) cada 6 horas
    - cron: '23 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del servidor
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] httpx cryptography cachetools python-dotenv

      - name: Descargar e instalar Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Iniciar Servidor FastAPI en segundo plano
        env:
          UID_AUTH: ${{ secrets.UID_AUTH }}
          HOST: ${{ secrets.HOST }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
          AES_IV: ${{ secrets.AES_IV }}
        run: |
          nohup python main.py > server.log 2>&1 &
          sleep 3
          # Verificar si el servidor local respondió correctamente
          curl -I http://localhost:8000 || (cat server.log && exit 1)

      - name: Iniciar Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "Iniciando túnel de Cloudflare..."
          # Se ejecuta en primer plano para mantener el workflow activo durante las 6 horas
          cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN"
